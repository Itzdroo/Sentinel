services:
  analyzer:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:?Set ETHEREUM_RPC_URL in your environment or .env file}
      RPC_TIMEOUT_SECONDS: ${RPC_TIMEOUT_SECONDS:-20}
      BLOCK_CHUNK_SIZE: ${BLOCK_CHUNK_SIZE:-5000}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-900}
      PERSISTENCE_PATH: /app/data/analyzer_cache.sqlite3
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
    volumes:
      - analyzer-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  analyzer-data:
